<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CivicScout | Active Mission</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #0f172a; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }
        .hud-overlay { position: absolute; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
        .leaflet-control-zoom { display: none !important; }
        .leaflet-tile-pane { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }
        .leaflet-container { cursor: crosshair !important; }

        @keyframes targetPulse {
            0% { transform: scale(0.8); opacity: 1; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.8); opacity: 1; box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .target-reticle-marker { animation: targetPulse 1.5s infinite; }
    </style>
</head>
<body class="text-white font-sans antialiased">

    <!-- The Map Container -->
    <div id="map"></div>

    <!-- TOP HUD: Player Stats -->
    <div class="hud-overlay top-0 left-0 w-full p-4 flex justify-between items-start">
        <div onclick="openProfileModal()" class="interactive cursor-pointer bg-slate-900/90 backdrop-blur-md border border-slate-700 hover:border-blue-500 transition-all p-3 rounded-2xl shadow-lg flex items-center gap-3 w-64">
            <div id="player-avatar" class="bg-blue-600 rounded-full w-12 h-12 flex items-center justify-center font-bold text-xl shadow-inner">J</div>
            <div class="flex-1">
                <h2 id="player-name-display" class="text-sm font-bold tracking-wide">Scout Justin</h2>
                <div class="flex justify-between text-xs text-slate-400 mt-1 mb-1">
                    <span>Lvl <span id="player-lvl">3</span></span>
                    <span><span id="player-xp">450</span> / 500 XP</span>
                </div>
                <div class="w-full bg-slate-700 rounded-full h-1.5">
                    <div id="player-xp-bar" class="bg-blue-500 h-1.5 rounded-full" style="width: 90%"></div>
                </div>
            </div>
        </div>

        <div class="interactive flex gap-2">
            <a href="admin.html" target="_blank" class="bg-slate-900/90 backdrop-blur-md border border-slate-700 hover:border-slate-500 px-4 py-2.5 rounded-xl shadow-lg text-xs font-bold uppercase tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-building-columns text-blue-400"></i> LGU Portal
            </a>
            <div class="bg-slate-900/90 backdrop-blur-md border border-slate-700 p-2.5 rounded-xl shadow-lg flex gap-2">
                <div class="w-10 h-10 rounded-full bg-yellow-500/25 border border-yellow-500 flex items-center justify-center text-yellow-400" title="First Responder">
                    <i class="fa-solid fa-medal"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM HUD -->
    <div id="scout-controls" class="hud-overlay bottom-0 left-0 w-full pb-8 pt-12 bg-gradient-to-t from-slate-900 via-slate-900/60 to-transparent flex flex-col items-center justify-end">
        <p class="text-xs font-semibold text-slate-300 mb-3 bg-slate-900/80 px-4 py-1.5 rounded-full border border-slate-700 backdrop-blur-sm">
            <i class="fa-solid fa-crosshairs text-blue-400 mr-1"></i> Click map to drop target pin, then tap Report
        </p>
        <button onclick="openReportModal()" class="interactive group relative flex flex-col items-center justify-center bg-blue-600 hover:bg-blue-500 transition-all active:scale-95 text-white w-20 h-20 rounded-full shadow-[0_0_20px_rgba(37,99,235,0.5)] border-4 border-slate-900">
            <i class="fa-solid fa-location-crosshairs text-3xl mb-1 group-hover:animate-bounce"></i>
            <span class="text-[10px] font-bold uppercase tracking-wider">Report</span>
        </button>
    </div>

    <!-- REPORT MODAL -->
    <div id="report-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end justify-center hidden transition-opacity duration-300">
        <div class="bg-slate-900 border-t border-slate-700 w-full max-w-lg rounded-t-3xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation text-amber-400"></i> Report Barangay Issue</h3>
                <button onclick="closeReportModal()" class="text-slate-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <form id="issue-form" onsubmit="submitIssue(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Select Issue Category</label>
                    <div class="grid grid-cols-3 gap-3">
                        <label class="cursor-pointer border border-slate-700 hover:border-blue-500 bg-slate-800/50 p-3 rounded-xl flex flex-col items-center text-center">
                            <input type="radio" name="category" value="Pothole" class="hidden peer" required>
                            <i class="fa-solid fa-road text-amber-500 text-xl mb-1 peer-checked:text-blue-400"></i>
                            <span class="text-xs font-semibold">Pothole</span>
                        </label>
                        <label class="cursor-pointer border border-slate-700 hover:border-blue-500 bg-slate-800/50 p-3 rounded-xl flex flex-col items-center text-center">
                            <input type="radio" name="category" value="Garbage" class="hidden peer">
                            <i class="fa-solid fa-trash-can text-emerald-500 text-xl mb-1 peer-checked:text-blue-400"></i>
                            <span class="text-xs font-semibold">Uncollected Trash</span>
                        </label>
                        <label class="cursor-pointer border border-slate-700 hover:border-blue-500 bg-slate-800/50 p-3 rounded-xl flex flex-col items-center text-center">
                            <input type="radio" name="category" value="Streetlight" class="hidden peer">
                            <i class="fa-solid fa-lightbulb text-yellow-500 text-xl mb-1 peer-checked:text-blue-400"></i>
                            <span class="text-xs font-semibold">Busted Light</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Description / Landmarks</label>
                    <textarea id="issue-desc" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="e.g. Malapit sa poste..."></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Attach Photo Evidence</label>
                    <label class="border-2 border-dashed border-slate-700 hover:border-blue-500 rounded-xl p-4 text-center cursor-pointer bg-slate-800/30 flex flex-col items-center justify-center block">
                        <input type="file" id="issue-photo" accept="image/*" class="hidden" onchange="previewImage(event)">
                        <div id="photo-preview-container" class="flex flex-col items-center">
                            <i class="fa-solid fa-camera text-2xl text-slate-400 mb-1"></i>
                            <p class="text-xs text-slate-400">Tap to snap or upload photo</p>
                        </div>
                    </label>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3.5 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> Deploy Scout Report (+50 XP)
                </button>
            </form>
        </div>
    </div>

    <!-- PROFILE MODAL -->
    <div id="profile-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center hidden p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-3xl p-6 shadow-2xl relative">
            <button onclick="closeProfileModal()" class="absolute top-5 right-5 text-slate-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
            <div class="flex items-center gap-4 mb-6">
                <div id="modal-avatar" class="bg-blue-600 rounded-full w-16 h-16 flex items-center justify-center font-bold text-2xl shadow-inner">J</div>
                <div>
                    <h3 id="modal-player-name" class="text-lg font-bold">Scout Justin</h3>
                    <p class="text-xs text-blue-400 font-semibold uppercase tracking-wider">Brgy. Batia Field Scout</p>
                </div>
            </div>
            <div class="mb-6 bg-slate-800/50 border border-slate-700/80 p-3 rounded-2xl">
                <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Edit Scout Identity</label>
                <div class="flex gap-2">
                    <input type="text" id="new-name-input" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none" placeholder="Enter new name...">
                    <button onclick="updatePlayerName()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-xl text-xs font-bold">Save</button>
                </div>
            </div>
            <div>
                <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Recent Reports History</h4>
                <div id="profile-reports-list" class="space-y-2 max-h-36 overflow-y-auto pr-1">
                    <p class="text-xs text-slate-500 italic">No reports submitted yet.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const savedScoutName = sessionStorage.getItem('scoutName');
        let playerData = {
            name: savedScoutName || "Scout Justin",
            level: 3,
            xp: 450,
            maxXp: 500,
            reports: JSON.parse(localStorage.getItem('civicScoutReports') || '[]')
        };

        if(savedScoutName) {
            document.getElementById('player-name-display').innerText = savedScoutName;
            document.getElementById('modal-player-name').innerText = savedScoutName;
            document.getElementById('player-avatar').innerText = savedScoutName.charAt(0).toUpperCase();
            document.getElementById('modal-avatar').innerText = savedScoutName.charAt(0).toUpperCase();
        }

        let uploadedImageBase64 = null;
        let selectedTargetCoords = null;
        let activeTargetMarker = null;

        const map = L.map('map', { center: [14.832, 120.943], zoom: 15, minZoom: 14, zoomControl: false });
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}').addTo(map);

        const batiaCoords = [
            [120.9349063, 14.8345626], [120.9340684, 14.8242754], [120.945087, 14.8191317], 
            [120.9459668, 14.8201847], [120.9455898, 14.8218858], [120.9473075, 14.8224123], 
            [120.9476008, 14.8242349], [120.9466372, 14.8260575], [120.9473494, 14.8266245], 
            [120.9500726, 14.8299456], [120.9500726, 14.8341576], [120.9522093, 14.83598], 
            [120.9522931, 14.839139], [120.951539, 14.8407184], [120.9517904, 14.8420144], 
            [120.9522512, 14.8435128], [120.9522093, 14.8448492], [120.949528, 14.8447682], 
            [120.9427408, 14.8446062], [120.9428246, 14.8386935], [120.9413583, 14.837762], 
            [120.9410231, 14.837195], [120.9403109, 14.8374785], [120.9367497, 14.835818], [120.9349063, 14.8345626]
        ];

        L.geoJSON({ "type": "FeatureCollection", "features": [{ "type": "Feature", "geometry": { "type": "Polygon", "coordinates": [[[-180, -90], [180, -90], [180, 90], [-180, 90], [-180, -90]], batiaCoords] } }] }, {
            style: { fillColor: '#000000', fillOpacity: 0.85, color: '#3b82f6', weight: 3, dashArray: '5, 10' }
        }).addTo(map);

        const boundingBox = L.polygon(batiaCoords.map(c => [c[1], c[0]])).getBounds();
        map.setMaxBounds(boundingBox.pad(0.1));
        map.fitBounds(boundingBox);

        // Load existing markers from storage
        playerData.reports.forEach(r => {
            const icon = L.divIcon({
                className: 'custom-icon',
                html: `<div style="background-color: ${r.category === 'Pothole' ? '#f59e0b' : r.category === 'Garbage' ? '#10b981' : '#eab308'}; width: 28px; height: 28px; border-radius: 50%; border: 3px solid white; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px rgba(59,130,246,0.8);"><i class="fa-solid ${r.category === 'Pothole' ? 'fa-road' : r.category === 'Garbage' ? 'fa-trash-can' : 'fa-lightbulb'} text-xs text-white"></i></div>`,
                iconSize: [28, 28], iconAnchor: [14, 14]
            });
            L.marker([r.lat, r.lng], {icon}).addTo(map).bindPopup(`<b>${r.category}</b><br>${r.description}`);
        });

        map.on('click', function(e) {
            selectedTargetCoords = e.latlng;
            if(activeTargetMarker) map.removeLayer(activeTargetMarker);
            const reticleIcon = L.divIcon({
                className: 'target-reticle-marker',
                html: `<div style="background-color: #ef4444; width: 22px; height: 22px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 12px #ef4444; display: flex; align-items: center; justify-content: center;"><div style="width: 6px; height: 6px; background: white; border-radius: 50%;"></div></div>`,
                iconSize: [22, 22], iconAnchor: [11, 11]
            });
            activeTargetMarker = L.marker([selectedTargetCoords.lat, selectedTargetCoords.lng], {icon: reticleIcon}).addTo(map);
        });

        function openReportModal() {
            if(!selectedTargetCoords) { alert("⚠️ Please click on the map to drop a target pin first!"); return; }
            document.getElementById('report-modal').classList.remove('hidden');
        }
        function closeReportModal() { document.getElementById('report-modal').classList.add('hidden'); }
        function openProfileModal() { document.getElementById('profile-modal').classList.remove('hidden'); renderProfileReports(); }
        function closeProfileModal() { document.getElementById('profile-modal').classList.add('hidden'); }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageBase64 = e.target.result;
                    document.getElementById('photo-preview-container').innerHTML = `
                        <img src="${uploadedImageBase64}" class="w-full h-24 object-cover rounded-lg mb-1 border border-blue-500">
                        <p class="text-[10px] text-emerald-400 font-bold"><i class="fa-solid fa-check-circle"></i> Attached!</p>`;
                }
                reader.readAsDataURL(file);
            }
        }

        function submitIssue(e) {
            e.preventDefault();
            const category = document.querySelector('input[name="category"]:checked').value;
            const desc = document.getElementById('issue-desc').value || "No additional details.";

            const report = {
                id: Date.now(),
                category: category,
                description: desc,
                image: uploadedImageBase64 || null,
                lat: selectedTargetCoords.lat,
                lng: selectedTargetCoords.lng,
                status: 'Pending Verification',
                time: 'Just now'
            };

            playerData.reports.unshift(report);
            localStorage.setItem('civicScoutReports', JSON.stringify(playerData.reports));

            if(activeTargetMarker) {
                const finalIcon = L.divIcon({
                    className: 'custom-icon',
                    html: `<div style="background-color: ${category === 'Pothole' ? '#f59e0b' : category === 'Garbage' ? '#10b981' : '#eab308'}; width: 28px; height: 28px; border-radius: 50%; border: 3px solid white; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px rgba(59,130,246,0.8);"><i class="fa-solid ${category === 'Pothole' ? 'fa-road' : category === 'Garbage' ? 'fa-trash-can' : 'fa-lightbulb'} text-xs text-white"></i></div>`,
                    iconSize: [28, 28], iconAnchor: [14, 14]
                });
                activeTargetMarker.setIcon(finalIcon);
                activeTargetMarker.bindPopup(`<b>${category} Report</b><br>${desc}`);
                activeTargetMarker = null;
            }

            playerData.xp += 50;
            closeReportModal();
            document.getElementById('issue-form').reset();
            uploadedImageBase64 = null;
            selectedTargetCoords = null;
            alert("Report deployed successfully! +50 XP earned.");
        }

        function renderProfileReports() {
            const container = document.getElementById('profile-reports-list');
            if(playerData.reports.length === 0) { container.innerHTML = `<p class="text-xs text-slate-500 italic">No reports submitted yet.</p>`; return; }
            container.innerHTML = playerData.reports.map(r => `
                <div class="bg-slate-800/80 border border-slate-700 p-2.5 rounded-xl flex items-center justify-between gap-3 text-xs">
                    <div class="flex items-center gap-3">
                        ${r.image ? `<img src="${r.image}" class="w-10 h-10 object-cover rounded-lg">` : `<div class="w-10 h-10 bg-slate-700 rounded-lg flex items-center justify-center"><i class="fa-solid fa-image"></i></div>`}
                        <div><span class="font-bold text-white">${r.category}</span><p class="text-slate-400 text-[10px] truncate max-w-[150px]">${r.description}</p></div>
                    </div>
                    <span class="px-2 py-1 bg-amber-500/20 text-amber-400 rounded-lg text-[10px] font-semibold">${r.status}</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
