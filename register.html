<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicScout | Account Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;1,900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .hero-title {
            font-style: italic;
            font-weight: 900;
            letter-spacing: -0.02em;
            text-shadow: 2px 4px 0px rgba(0,0,0,0.2);
        }
        .btn-3d {
            transition: all 0.1s;
            box-shadow: 0 6px 0px #1d4ed8;
        }
        .btn-3d:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0px #1d4ed8;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-[#3b1744] via-[#5c2460] to-[#b33e72] min-h-screen text-white flex items-center justify-center p-4 sm:p-6">

    <div class="bg-[#1e1332] w-full max-w-md p-7 sm:p-8 rounded-3xl shadow-2xl border border-white/10 relative">
        
        <!-- Mode Toggle Tabs -->
        <div class="grid grid-cols-2 gap-1 bg-[#160d26] p-1 rounded-xl mb-6 text-xs font-bold">
            <button type="button" id="tab-signup" onclick="setAuthMode('signup')" class="py-2.5 rounded-lg bg-blue-600 text-white transition-all">CREATE ACCOUNT</button>
            <button type="button" id="tab-login" onclick="setAuthMode('login')" class="py-2.5 rounded-lg text-gray-400 hover:text-white transition-all">LOG IN</button>
        </div>

        <!-- Error Alert -->
        <div id="auth-error" class="hidden mb-4 bg-red-500/20 border border-red-500/50 text-red-200 text-xs font-semibold px-4 py-3 rounded-xl"></div>

        <!-- SIGN UP VIEW -->
        <div id="signup-view">
            <div class="text-center mb-6">
                <h1 class="hero-title text-3xl mb-1">CREATE ACCOUNT</h1>
                <p class="text-pink-200 text-xs">Choose your role to enter the CivicScout network</p>
            </div>

            <form onsubmit="handleSignup(event)" class="space-y-4">
                <!-- Role Selector -->
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-300 mb-2">Select Account Role</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="scout" checked onchange="toggleRoleFields()" class="hidden peer">
                            <div class="border border-white/15 bg-[#160d26] peer-checked:border-blue-500 peer-checked:bg-blue-600/20 p-3 rounded-xl text-center transition-all">
                                <i class="fa-solid fa-gamepad text-pink-400 text-lg mb-1"></i>
                                <p class="text-xs font-bold">Community Scout</p>
                                <p class="text-[10px] text-gray-400">Player / Citizen</p>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="lgu" onchange="toggleRoleFields()" class="hidden peer">
                            <div class="border border-white/15 bg-[#160d26] peer-checked:border-emerald-500 peer-checked:bg-emerald-600/20 p-3 rounded-xl text-center transition-all">
                                <i class="fa-solid fa-building-columns text-emerald-400 text-lg mb-1"></i>
                                <p class="text-xs font-bold">LGU Official</p>
                                <p class="text-[10px] text-gray-400">Barangay Admin</p>
                            </div>
                        </label>
                    </div>
                </div>

                <div>
                    <label id="name-label" class="block text-[11px] font-bold uppercase tracking-wider text-gray-300 mb-1">Scout Codename / Full Name</label>
                    <input type="text" id="reg-name" required class="w-full bg-[#160d26] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-pink-500" placeholder="e.g. Scout Neil">
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-300 mb-1">Email Address</label>
                    <input type="email" id="reg-email" required class="w-full bg-[#160d26] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-pink-500" placeholder="you@civicscout.app">
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-300 mb-1">Password</label>
                    <input type="password" id="reg-password" required minlength="4" class="w-full bg-[#160d26] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-pink-500" placeholder="Create password...">
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-300 mb-1">Barangay Jurisdiction</label>
                    <select id="reg-brgy" class="w-full bg-[#160d26] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-pink-500">
                        <option value="Brgy. Batia">Brgy. Batia, Bocaue (Active Scope)</option>
                        <option value="Brgy. Poblacion">Brgy. Poblacion, Bocaue</option>
                    </select>
                </div>

                <!-- LGU Authorization Code Field (Shown only when LGU Official is selected) -->
                <div id="lgu-code-group" class="hidden bg-emerald-950/40 border border-emerald-500/30 p-3 rounded-xl">
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-emerald-300 mb-1">LGU Authorization Code</label>
                    <input type="text" id="reg-lgu-code" class="w-full bg-[#160d26] border border-emerald-500/40 rounded-lg px-3 py-2 text-sm text-white focus:outline-none" placeholder="Enter code: BATIA-LGU-2026">
                    <p class="text-[10px] text-emerald-400/80 mt-1">Demo Defense Key: <code class="font-bold">BATIA-LGU-2026</code></p>
                </div>

                <button type="submit" id="signup-submit-btn" class="btn-3d w-full bg-blue-600 hover:bg-blue-500 text-white font-black italic text-lg py-3.5 rounded-xl mt-2">
                    REGISTER & ENTER MISSION
                </button>
            </form>
        </div>

        <!-- LOGIN VIEW -->
        <div id="login-view" class="hidden">
            <div class="text-center mb-6">
                <h1 class="hero-title text-3xl mb-1">WELCOME BACK</h1>
                <p class="text-pink-200 text-xs">Sign in to route automatically to your Scout or LGU portal</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-300 mb-1">Email Address</label>
                    <input type="email" id="login-email" required class="w-full bg-[#160d26] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-pink-500" placeholder="Enter registered email...">
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-300 mb-1">Password</label>
                    <input type="password" id="login-password" required class="w-full bg-[#160d26] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-pink-500" placeholder="Enter password...">
                </div>

                <button type="submit" class="btn-3d w-full bg-blue-600 hover:bg-blue-500 text-white font-black italic text-lg py-3.5 rounded-xl mt-2">
                    SIGN IN TO PORTAL
                </button>
            </form>

            <!-- Quick Demo Credentials Helper for Live Presentation -->
            <div class="mt-5 bg-[#160d26] border border-white/10 p-3 rounded-xl text-[11px] text-gray-400">
                <p class="font-bold text-gray-300 mb-1">Built-in LGU Demo Account:</p>
                <div class="flex justify-between items-center">
                    <span><code>lgu@batia.gov.ph</code> / <code>batia2026</code></span>
                    <button type="button" onclick="fillDemoLGU()" class="text-emerald-400 hover:underline font-bold">Auto-Fill</button>
                </div>
            </div>
        </div>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-xs text-gray-400 hover:text-white transition-colors">← Back to Landing Page</a>
        </div>
    </div>

    <script src="civicscout-core.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('mode') === 'login') setAuthMode('login');

        function setAuthMode(mode) {
            document.getElementById('auth-error').classList.add('hidden');
            if (mode === 'login') {
                document.getElementById('signup-view').classList.add('hidden');
                document.getElementById('login-view').classList.remove('hidden');
                document.getElementById('tab-login').className = 'py-2.5 rounded-lg bg-blue-600 text-white transition-all';
                document.getElementById('tab-signup').className = 'py-2.5 rounded-lg text-gray-400 hover:text-white transition-all';
            } else {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('signup-view').classList.remove('hidden');
                document.getElementById('tab-signup').className = 'py-2.5 rounded-lg bg-blue-600 text-white transition-all';
                document.getElementById('tab-login').className = 'py-2.5 rounded-lg text-gray-400 hover:text-white transition-all';
            }
        }

        function toggleRoleFields() {
            const role = document.querySelector('input[name="role"]:checked').value;
            const lguGroup = document.getElementById('lgu-code-group');
            const lguInput = document.getElementById('reg-lgu-code');
            const nameLabel = document.getElementById('name-label');
            const nameInput = document.getElementById('reg-name');
            const submitBtn = document.getElementById('signup-submit-btn');

            if (role === 'lgu') {
                lguGroup.classList.remove('hidden');
                lguInput.required = true;
                nameLabel.innerText = 'Official Name / Designation';
                nameInput.placeholder = 'e.g. Kagawad Santos';
                submitBtn.innerText = 'CREATE LGU ADMIN ACCOUNT';
            } else {
                lguGroup.classList.add('hidden');
                lguInput.required = false;
                nameLabel.innerText = 'Scout Codename / Full Name';
                nameInput.placeholder = 'e.g. Scout Neil';
                submitBtn.innerText = 'CREATE SCOUT ACCOUNT';
            }
        }

        function showError(msg) {
            const box = document.getElementById('auth-error');
            box.innerText = msg;
            box.classList.remove('hidden');
        }

        async function handleSignup(e) {
            e.preventDefault();
            document.getElementById('auth-error').classList.add('hidden');
            try {
                const role = document.querySelector('input[name="role"]:checked').value;
                const user = await CivicCore.registerAccount({
                    name: document.getElementById('reg-name').value,
                    email: document.getElementById('reg-email').value,
                    password: document.getElementById('reg-password').value,
                    role,
                    barangay: document.getElementById('reg-brgy').value,
                    lguCode: document.getElementById('reg-lgu-code').value.trim()
                });
                // Route based on role: Player -> app.html, LGU -> admin.html
                window.location.href = user.role === 'lgu' ? 'admin.html' : 'app.html';
            } catch (err) {
                showError(err.message);
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            document.getElementById('auth-error').classList.add('hidden');
            try {
                const user = await CivicCore.loginAccount({
                    email: document.getElementById('login-email').value,
                    password: document.getElementById('login-password').value
                });
                // Route based on role: Player -> app.html, LGU -> admin.html
                window.location.href = user.role === 'lgu' ? 'admin.html' : 'app.html';
            } catch (err) {
                showError(err.message);
            }
        }

        function fillDemoLGU() {
            document.getElementById('login-email').value = 'lgu@batia.gov.ph';
            document.getElementById('login-password').value = 'batia2026';
        }
    </script>
</body>
</html>
